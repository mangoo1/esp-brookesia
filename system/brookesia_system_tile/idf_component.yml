version: "0.1.0"
description: ESP-Brookesia custom Tile System
dependencies:
  espressif/brookesia_system_core:
    version: "0.8.*"
    override_path: ../../system/brookesia_system_core
    require: public

  espressif/brookesia_service_helper:
    version: "0.8.*"
    override_path: ../../service/framework/brookesia_service_helper
    require: public

  espressif/brookesia_service_wifi:
    version: "0.8.*"
    override_path: ../../service/network/brookesia_service_wifi
    require: private

  espressif/brookesia_service_sntp:
    version: "0.8.*"
    override_path: ../../service/network/brookesia_service_sntp
    require: private

  espressif/brookesia_service_http:
    version: "0.8.*"
    override_path: ../../service/network/brookesia_service_http
    require: private
